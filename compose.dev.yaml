# Mac dev overrides. Use via `make up` (docker compose -f compose.yaml -f compose.dev.yaml).
#
# Debug ports are bound to 127.0.0.1 only. Docker does not publish ports of containers that are
# attached only to `internal` networks, so data services also join the dev-only `devhost`
# bridge. That network never exists in prod.

networks:
  devhost:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.9.0/24 }] }

volumes:
  # Caddy's local root *certificate* only (see caddy-ca), never the CA keys next to it.
  caddy_ca:

secrets:
  dev_user_password: { file: ./secrets/dev_user_password }
  dev_totp_seed: { file: ./secrets/dev_totp_seed }

services:
  postgres:
    networks: [backend, devhost]
    ports: ["127.0.0.1:5432:5432"]

  redis:
    networks: [backend, devhost]
    ports: ["127.0.0.1:6379:6379"]

  qdrant:
    networks: [backend, devhost]
    ports: ["127.0.0.1:6333:6333"]

  minio:
    networks: [backend, devhost]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  clamav:
    networks: [backend, egress, devhost]
    ports: ["127.0.0.1:3310:3310"]

  keycloak:
    secrets:
      [pg_keycloak_password, keycloak_admin_password, oidc_client_secret, dev_user_password, dev_totp_seed]
    environment:
      KC_COMMAND: start-dev --import-realm
      KC_LOG_LEVEL: info
    volumes:
      - ./infra/keycloak/realm-spoldzielnia.json:/opt/keycloak/data/import/realm-spoldzielnia.json:ro

  # --- Application ----------------------------------------------------------
  migrate:
    build: &backend-build
      context: .
      dockerfile: docker/backend.Dockerfile
      target: api
    environment:
      SPOLDZIELNIA_ENVIRONMENT: dev

  bootstrap:
    build: *backend-build
    environment:
      SPOLDZIELNIA_ENVIRONMENT: dev

  api:
    build: *backend-build
    environment:
      SPOLDZIELNIA_ENVIRONMENT: dev
      # The OIDC client reaches the issuer through Caddy, whose dev certificate comes from its
      # local CA. Loaded on first use: the file appears once the proxy is up (caddy-ca).
      SPOLDZIELNIA_OIDC__CA_BUNDLE: /run/caddy-ca/root.crt
    volumes:
      - caddy_ca:/run/caddy-ca:ro
    develop:
      watch:
        # The image installs the package non-editable, so source changes rebuild it.
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./pyproject.toml }
        - { action: rebuild, path: ./uv.lock }

  worker-media:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: worker-media
    environment:
      SPOLDZIELNIA_ENVIRONMENT: dev
    develop:
      watch:
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./uv.lock }

  worker-egress:
    build: *backend-build
    environment:
      SPOLDZIELNIA_ENVIRONMENT: dev
    develop:
      watch:
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./uv.lock }

  models-init:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: worker-media

  proxy:
    # Dev: HTTPS on loopback only.
    ports: !override ["127.0.0.1:80:80", "127.0.0.1:443:443"]
    environment:
      # Docker Desktop NATs browser traffic from the host through a private bridge address.
      KC_ADMIN_ALLOW: private_ranges

  # Dev only: copy Caddy's local root certificate into `caddy_ca` once the proxy has created it.
  # Mounting caddy_data itself into the api would expose the CA private keys. It stays up (idle)
  # so `up --wait` can wait on its healthcheck: a one-shot that exits fails `--wait`.
  caddy-ca:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        src=/caddy/caddy/pki/authorities/local/root.crt
        for _ in $$(seq 60); do [ -s "$$src" ] && break; sleep 1; done
        cp "$$src" /ca/.root.crt.tmp && chmod 0444 /ca/.root.crt.tmp && mv -f /ca/.root.crt.tmp /ca/root.crt
        exec sleep infinity
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-s", "/ca/root.crt"]
      interval: 5s
      timeout: 2s
      retries: 30
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - caddy_data:/caddy:ro
      - caddy_ca:/ca
    depends_on:
      proxy: { condition: service_healthy }

  mailpit:
    networks: [public]
    ports: ["127.0.0.1:8025:8025"]
