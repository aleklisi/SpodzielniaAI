name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit (tag in the comment); the runner image to a release, so a new
# ubuntu-latest (Compose version, packages) does not change CI unannounced.

jobs:
  lint-type-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration and not ml and not e2e" --cov=spoldzielnia_ai

  integration:
    needs: lint-type-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # test_infra_smoke reads the generated ./secrets (gitignored).
      - run: cp .env.example .env && make secrets
      - run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: docker buildx bake --load
      - run: infra/scripts/audit.sh

  # 6.8: back up a running stack, restore it into a bare copy of the checkout (its own compose
  # project and volumes), verify (row counts, objects, audit chain, rebuilt indexes) and smoke
  # test it (infra/scripts/dr-rehearsal.sh). The runner has no model server: a placeholder HTTP
  # server answers on the relay's port, and the optional built-in engines stay off.
  dr-rehearsal:
    needs: lint-type-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLM_BUILTIN_TRANSCRIPTION: "false"
      LLM_BUILTIN_OCR: "false"
      LLM_BUILTIN_IMAGE_EMBED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y age jq
      - run: cp .env.example .env && make secrets
      - name: Placeholder for the dev relay's model server (host port 1234)
        run: nohup python3 -m http.server 1234 --bind 0.0.0.0 >/dev/null 2>&1 &
      - run: docker buildx bake --load
      - run: docker compose -f compose.yaml -f compose.dev.yaml --profile tools run --rm models-init
      - run: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait --wait-timeout 900
      - run: make smoke
      - run: DR_MODELS=download make dr-rehearsal
