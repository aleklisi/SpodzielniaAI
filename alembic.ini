# Host-side Alembic CLI (`uv run alembic …`), e.g. `make revision`. Containers don't use this
# file: `spoldzielnia migrate` configures Alembic in code (spoldzielnia_ai.db.migrate).
# The DSN comes from settings (owner role); see env.py.
[alembic]
script_location = spoldzielnia_ai.db:migrations
# Revision ids are explicit (`--rev-id 0002_rls`), so the file is named after them.
file_template = %%(rev)s
prepend_sys_path = src
path_separator = os
timezone = UTC
