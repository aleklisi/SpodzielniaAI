[project]
name = "spoldzielnia-ai"
version = "0.1.0"
description = "Spółdzielnia AI — cooperative knowledge platform with private notebooks, governed wiki and anti-distillation RAG"
readme = "README.md"
authors = [
    { name = "Piotr Pacewicz", email = "piotr@pacewi.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "litellm>=1.105.1",
    "minio>=7.2.20",
    "mutagen>=1.48.1",
    "pikepdf>=10.17.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis[hiredis]>=5",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spoldzielnia = "spoldzielnia_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# Media workers only (2.5): faster-whisper, Docling (pulls PyTorch). The api image is built
# with `--no-default-groups`; the worker-media image adds `--group media`.
media = [
    "faster-whisper>=1.2.0",
    "docling>=2.60.0",
    "huggingface-hub>=0.35.0",
    # Direct so that [tool.uv.sources] can route them to the CPU index on Linux.
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]
dev = [
    "fakeredis[lua]>=2.40.0",
    "freezegun>=1.5.5",
    "hypothesis>=6.170.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "testcontainers[postgres,redis]>=4.15.0",
]
core = [
    # Prompt-injection classifier runtime (3.3); torch is routed to the CPU index on Linux.
    "transformers>=4.50.0",
    "torch>=2.8.0",
    "pl-core-news-lg",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "spacy>=3.8.16",
]

[tool.uv]
default-groups = ["dev", "media", "core"]

# CPU-only PyTorch wheels on Linux (the worker image); PyPI's default Linux x86_64 wheels bundle
# CUDA (~GBs). GPU builds use their own index via compose.gpu.yaml (Stage 6).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
pl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF", "PT", "TC"]

[tool.ruff.lint.per-file-ignores]
# Tests may touch files synchronously inside async tests.
"tests/**" = ["S101", "S311", "ASYNC230", "ASYNC240"]  # S311: non-crypto RNG for fixtures

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
    "spoldzielnia_ai.db.base.Base",
    "spoldzielnia_ai.db.base.Entity",
    "spoldzielnia_ai.db.base.UUIDPrimaryKey",
    "spoldzielnia_ai.db.base.Timestamps",
]

[tool.ruff.lint.isort]
known-first-party = ["spoldzielnia_ai"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "-ra"]
markers = [
    "integration: requires Docker services (testcontainers / compose stack)",
    "ml: requires heavy ML models (Presidio, spaCy, LLM-Guard)",
    "e2e: end-to-end tests against the running compose stack",
]
